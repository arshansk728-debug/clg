version: '3.8'

services:
  # MongoDB Database for Development
  mongodb:
    image: mongo:7.0
    container_name: college_chatbot_mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: college_chatbot_dev
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - college_chatbot_dev_network

  # Redis for Development
  redis:
    image: redis:7-alpine
    container_name: college_chatbot_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - college_chatbot_dev_network
    command: redis-server --appendonly yes

volumes:
  mongodb_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  college_chatbot_dev_network:
    driver: bridge
